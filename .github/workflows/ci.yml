name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Windows server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyautogui/pyperclip are mocked in tests, so only the
      # protocol-level dependencies are needed here
      - name: Install dependencies
        run: pip install websockets pytest

      - name: Run tests
        run: pytest windows/ -v

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon
